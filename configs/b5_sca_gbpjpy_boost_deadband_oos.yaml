# B-5 検証（OOS期間 2016-2021）— リバーサルBoost の drift デッドバンド
#
# IS版 (b5_sca_gbpjpy_boost_deadband_is.yaml) と必ず対で評価する。判定条件はIS版のコメント参照。
# ⚠️ model: every_tick 必須。実行は開発PCで。

mt5_path: "C:\\Users\\f\\AppData\\Roaming\\XMTrading MT5\\terminal64.exe"

expert:    "SCA_EA"
symbol:    "GBPJPY"
period:    "M15"
from_date: "2016.06.21"
to_date:   "2021.06.20"

deposit:  100000
currency: "JPY"
leverage: 25

model: "every_tick"

parameters:
  RangeStartHour:    0
  RangeEndHour:      9
  TradeEndHour:      12
  ForceCloseHour:    22
  MinRange_ATRd:     0.30
  MaxRange_ATRd:     1.00
  Break_Buffer_ATRd: 0.0
  SL_Mode:           0
  SL_ATRd_Mult:      0.5
  RR_Ratio:          2.0
  OneShotPerDir:     true
  UseD1TrendFilter:  false
  MaxSpreadPoints:   0
  LotSize:           0.01
  UseRiskSizing:     false
  MagicNumber:       20261001
  UseReversalBoost:  true
  Boost_Mult:        2.0
  Boost_MinDrift_ATRd: 0.0

optimize:
  enabled:   true
  criterion: "balance"
  parameters:
    Boost_MinDrift_ATRd:
      from: 0.00
      to:   0.20
      step: 0.05

report_dir:  "results"
report_name: "B5_SCA_GBPJPY_BoostDeadband_OOS"
